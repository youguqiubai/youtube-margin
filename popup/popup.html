<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vitro</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon48.png" alt="" width="32" height="32" />
      <div>
        <h1>Vitro</h1>
        <p><span data-i18n="popup.tagline"></span> · <span id="version"></span></p>
      </div>
      <button class="switch" data-key="enabled" role="switch" data-i18n-aria="popup.toggle"></button>
    </header>

    <button id="edit" class="primary" data-i18n="popup.edit"></button>

    <section>
      <h2 data-i18n="popup.cleanup"></h2>
      <label><span data-i18n="opt.hideShorts"></span> <button class="switch" data-key="hideShorts" role="switch"></button></label>
      <label><span data-i18n="opt.blockAds"></span> <button class="switch" data-key="blockAds" role="switch"></button></label>
      <label><span data-i18n="popup.hideRelated"></span> <button class="switch" data-key="hideRelated" role="switch"></button></label>
      <label><span data-i18n="opt.hideEndscreens"></span> <button class="switch" data-key="hideEndscreens" role="switch"></button></label>
      <label><span data-i18n="opt.hideMerch"></span> <button class="switch" data-key="hideMerch" role="switch"></button></label>
      <label><span data-i18n="opt.hideMembers"></span> <button class="switch" data-key="hideMembers" role="switch"></button></label>
      <label><span data-i18n="opt.hidePaid"></span> <button class="switch" data-key="hidePaid" role="switch"></button></label>
      <label><span data-i18n="opt.hideGames"></span> <button class="switch" data-key="hideGames" role="switch"></button></label>
    </section>

    <section>
      <h2 data-i18n="popup.appearance"></h2>
      <label><span data-i18n="popup.hero"></span> <button class="switch" data-key="hero" role="switch"></button></label>
      <label><span data-i18n="popup.cards"></span> <button class="switch" data-key="cards" role="switch"></button></label>
      <label><span data-i18n="popup.light"></span> <button class="switch" data-key="light" role="switch"></button></label>
      <label><span data-i18n="popup.room"></span> <button class="switch" data-key="room" role="switch"></button></label>
      <label><span data-i18n="opt.forceDark"></span> <button class="switch" data-key="forceDark" role="switch"></button></label>
    </section>

    <section>
      <h2 data-i18n="popup.language"></h2>
      <select id="language" data-i18n-aria="popup.language">
        <option value="auto" data-i18n="popup.lang.auto"></option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </section>

    <section>
      <h2>推荐过滤</h2>
      <label><span>启用过滤</span> <button class="switch" id="filter-on" role="switch"></button></label>
      <label class="col"><span>标题关键词（逗号分隔）</span>
        <input id="f-keywords" type="text" placeholder="恰饭, 广告, 剧透" autocomplete="off" /></label>
      <label class="col"><span>频道关键词（逗号分隔）</span>
        <input id="f-channels" type="text" placeholder="某个 UP 的名字" autocomplete="off" /></label>
      <div class="row2">
        <label class="col"><span>最低播放量</span>
          <input id="f-minviews" type="number" min="0" placeholder="0" /></label>
        <label class="col"><span>最长时长（分）</span>
          <input id="f-maxdur" type="number" min="0" placeholder="0" /></label>
      </div>
    </section>

    <section>
      <h2>足迹热力图</h2>
      <div class="heat-sum" id="heat-sum"></div>
      <div class="heat" id="heat"></div>
      <div class="heat-foot"><span>少</span><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i><span>多</span><button id="heat-clear" class="link">清空</button></div>
    </section>

    <section>
      <h2>命令面板</h2>
      <p class="hint">按 <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> 呼出，键盘完成跳转、开关与外观切换</p>
    </section>

    <footer><button id="reset" class="link" data-i18n="popup.reset"></button></footer>

    <script src="../src/settings.js"></script>
    <script src="../src/footprint.js"></script>
    <script src="../src/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
